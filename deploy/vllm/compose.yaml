# vLLM on the Windows RTX 4090 PC (Docker Desktop, WSL2 backend, NVIDIA GPU).
# vLLM has no native Windows build (official install docs), so it runs in this Linux container.
#   cd deploy/vllm && cp .env.example .env && docker compose up -d
#   curl -H "Authorization: Bearer $VLLM_API_KEY" http://localhost:8000/v1/models
services:
  vllm:
    image: vllm/vllm-openai:${VLLM_TAG:-latest}   # pin the tag that worked for you
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"   # Windows Firewall: allow inbound 8000 only from Tailscale (100.64.0.0/10)
    environment:
      - VLLM_API_KEY=${VLLM_API_KEY:?set VLLM_API_KEY in .env}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE:-./hf-cache}:/root/.cache/huggingface   # pre-download here for offline (air-gapped) runs
    command:
      - ${VLLM_MODEL:?set VLLM_MODEL in .env}
      - --served-model-name
      - local                        # the app always asks for "local", whatever model is loaded
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-16384}"
      - --gpu-memory-utilization     # vLLM pre-allocates this share of VRAM for weights + KV cache
      - "${VLLM_GPU_UTIL:-0.90}"
      - --enable-auto-tool-choice    # required: structured output in this project uses tool calls
      - --tool-call-parser
      - ${VLLM_TOOL_PARSER:-hermes}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

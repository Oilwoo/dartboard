# Tests and lint on every push and pull request. Actions are pinned to commit SHAs (tags can be moved).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" ruff
      - run: ruff check --select F,E9,B,I src tests
      - run: pytest -q -p no:cacheprovider
